<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gridline | Two-minute guided demonstration</title><style>body{margin:0;background:#123c43;color:white;font:16px Arial}header{padding:18px 25px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}button,a{background:#d8f3e8;color:#0a5049;padding:9px 15px;border:0;border-radius:5px;text-decoration:none;cursor:pointer;font:14px Arial}p{margin:0;color:#c5dedb;max-width:700px;line-height:1.4}iframe{display:block;width:100%;height:calc(100vh - 130px);border:0;background:white}#time{font-variant-numeric:tabular-nums}small{font-size:12px;color:#aecfca}</style></head><body><header><h1>Gridline / 2-minute live walkthrough</h1><button id="play">Start</button><span id="time">0:00 / 2:00</span><a href="demo.mp4" download>Download captioned overview video</a><p id="caption">Follow six sections of the live website. You can pause and interact at any point. AI activation remains separate.</p></header><iframe title="Live Gridline website" id="site" src="/"></iframe><script>const scenes=[['overview','0:00–0:20 · Start with the conditional recommendation, capacity envelope and lack of signed demand.'],['model','0:20–0:40 · Change assumptions; compare build, lease and hybrid. Review base, grid-delay and half-utilisation cases.'],['design','0:40–1:00 · Inspect power, cooling and networking. Switch to transformer failure or the 48-hour outage.'],['evidence','1:00–1:20 · Compare three countries, inspect source dates and filter facts, assumptions and unknowns.'],['pack','1:20–1:40 · Download the two-page memo and one-page diagram; run the five-minute committee presentation.'],['adviser','1:40–2:00 · Sign in and register. AI answers require activation and cite saved evidence; editor changes require authorised access.']];let seconds=0,running=false;const btn=document.getElementById('play');function scene(){const n=Math.min(5,Math.floor(seconds/20));document.getElementById('caption').textContent=scenes[n][1];document.getElementById('site').contentWindow.postMessage({gridlineTab:scenes[n][0]},location.origin)}btn.onclick=()=>{if(seconds>=120)seconds=0;running=!running;btn.textContent=running?'Pause':'Resume';scene()};setInterval(()=>{if(!running)return;seconds++;document.getElementById('time').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+' / 2:00';if(seconds%20===0&&seconds<120)scene();if(seconds>=120){running=false;btn.textContent='Restart';}},1000);</script></body></html>
